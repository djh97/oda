name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  python:
    name: Python and dataset validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run core Python tests
        # Model-training and retained-evidence tests use the optional ML stack
        # and local artifacts; the full suite remains available through the
        # documented development setup.
        run: |
          python -m pytest -q \
            --ignore=tests/test_fine_tuning_loss_figure.py \
            --ignore=tests/test_full_workflow.py \
            --ignore=tests/test_local_lora.py \
            --ignore=tests/test_manuscript_tables.py \
            --ignore=tests/test_prepare_local_model.py \
            --ignore=tests/test_protocol_amendment.py \
            --ignore=tests/test_training_reconciliation.py

      - name: Validate retained synthetic dataset
        run: python -m evaluation.validate_synthetic_data > /dev/null

      - name: Verify retained evidence checksums
        run: python ../reproducibility/verify_evidence.py

  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
